[project]
name = "djangoadmin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cloudinary>=1.46.3",
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-extensions>=4.1",
    "django-filter>=26.2.0",
    "django-import-export>=4.4.2",
    "django-unfold>=0.110.0",
    "djangorestframework>=3.18.3",
    "drf-redesign>=0.6.0",
    "drf-spectacular>=0.30.0",
    "markdown>=3.11.1",
    "pillow>=12.3.0",
    "pydot>=4.0.1",
    "pygraphviz>=2.0.4",
    "pyparsing>=3.3.3",
    "uvicorn>=0.54.0",
    "whitenoise>=6.12.0",
]
[tool.autopep8]
indent_size = 2
[tool.mypy]
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "Admin.settings"
